<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplikasi to-do list tugas kuliah dengan penyimpanan lokal, kamera, dan pengingat.">
    <meta name="theme-color" content="#2563eb">
    <title>Farrel's To Do</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <script>
        try {
            if (localStorage.getItem('todo-theme') === 'dark') {
                document.body.classList.add('dark-mode');
            }
        } catch (error) {}
    </script>

    <a class="skip-link" href="#main-content">Lewati ke konten utama</a>

    <header class="app-header">
        <h1>My To Do Webpage</h1>
        <div class="header-actions">
            <button type="button" id="notify-btn" class="btn-theme" hidden>Aktifkan Notifikasi</button>
            <button type="button" id="theme-toggle" class="btn-theme">Dark Mode</button>
        </div>
    </header>

    <main id="main-content" class="container" tabindex="-1">
        <section class="panel form-panel" aria-labelledby="form-heading">
            <h2 id="form-heading">Create New Task</h2>
            <form id="todo-form" novalidate>
                <div class="form-group">
                    <label for="title">Title <span class="required" aria-hidden="true">*</span><span class="sr-only">(wajib diisi)</span></label>
                    <input type="text" id="title" placeholder="Contoh: KKA - Uninformed Search" required aria-required="true" aria-describedby="title-error" autocomplete="off">
                    <p id="title-error" class="field-error" role="alert" hidden>Title wajib diisi.</p>
                </div>

                <div class="form-group">
                    <label for="tag">Tag</label>
                    <input type="text" id="tag" placeholder="Contoh: KKA" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="deadline">Deadline</label>
                    <input type="date" id="deadline">
                </div>

                <div class="form-group">
                    <label for="notify-time">Waktu Notifikasi</label>
                    <input type="datetime-local" id="notify-time" aria-describedby="notify-help">
                    <p id="notify-help" class="field-help">Pengingat muncul saat waktu ini tercapai. Aplikasi harus terbuka dan notifikasi harus diizinkan.</p>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="4" placeholder="Deskripsi tugas..."></textarea>
                </div>

                <fieldset class="form-group image-field">
                    <legend>Gambar (opsional)</legend>

                    <div class="image-actions">
                        <button type="button" id="camera-btn" class="btn btn-secondary">Buka Kamera</button>
                    </div>

                    <label for="image-file" class="file-label">Atau pilih / ambil foto dari perangkat</label>
                    <input type="file" id="image-file" accept="image/*" capture="environment">

                    <div id="camera-box" class="camera-box" hidden>
                        <video id="camera-video" autoplay playsinline muted aria-label="Pratinjau kamera"></video>
                        <div class="image-actions">
                            <button type="button" id="capture-btn" class="btn btn-primary">Ambil Gambar</button>
                            <button type="button" id="camera-close-btn" class="btn btn-secondary">Tutup Kamera</button>
                        </div>
                    </div>

                    <div id="image-preview-box" class="image-preview-box" hidden>
                        <img id="image-preview" alt="Pratinjau gambar yang akan dilampirkan">
                        <button type="button" id="image-remove-btn" class="btn btn-secondary">Hapus Gambar</button>
                    </div>

                    <p id="image-error" class="field-error" role="alert" hidden></p>
                    <canvas id="capture-canvas" hidden></canvas>
                </fieldset>

                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="btn btn-primary">Add Todo</button>
                    <button type="button" id="cancel-btn" class="btn btn-secondary" hidden>Cancel</button>
                </div>
            </form>
        </section>

        <section class="panel list-panel" aria-labelledby="list-heading">
            <h2 id="list-heading">Task List</h2>
            <ul id="todo-list" class="todo-list">
            </ul>
        </section>

        <section class="panel detail-panel" aria-labelledby="detail-heading">
            <h2 id="detail-heading">Task Details</h2>
            <div id="task-detail" aria-live="polite">
            </div>
        </section>
    </main>

    <div id="status" class="sr-only" role="status" aria-live="polite"></div>

    <footer class="app-footer">
        <p>&copy; 2026 Farrel Rizqi Pangestu - Tugas Pemrograman Web</p>
    </footer>
</body>
</html>
