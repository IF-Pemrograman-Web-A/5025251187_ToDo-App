<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farrel's To Do</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="app-header">
        <h1>My To Do Webpage</h1>
        <button id="theme-toggle" class="btn-theme">Dark Mode</button>
    </header>

    <main class="container">
        <section class="panel form-panel">
            <h2 id="form-heading">Create New Task</h2>
            <form id="todo-form">
                <div class="form-group">
                    <label for="title">Title <span class="required">*</span></label>
                    <input type="text" id="title" placeholder="Contoh: KKA - Uninformed Search" required>
                </div>

                <div class="form-group">
                    <label for="tag">Tag</label>
                    <input type="text" id="tag" placeholder="Contoh: KKA">
                </div>

                <div class="form-group">
                    <label for="deadline">Deadline</label>
                    <input type="date" id="deadline">
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="4" placeholder="Deskripsi tugas..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="btn btn-primary">Add Todo</button>
                    <button type="button" id="cancel-btn" class="btn btn-secondary" hidden>Cancel</button>
                </div>
            </form>
        </section>

        <section class="panel list-panel">
            <h2>Task List</h2>
            <ul id="todo-list" class="todo-list">
            </ul>
        </section>

        <section class="panel detail-panel">
            <h2>Task Details</h2>
            <div id="task-detail">
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <p>&copy; 2026 Farrel Rizqi Pangestu - Tugas Pemrograman Web</p>
    </footer>
</body>
</html>
