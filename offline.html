<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>Offline - My To Do</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #1e1e2e; color: #f3f4f6; padding: 1.5rem; text-align: center;
        }
        main { max-width: 420px; }
        img { width: 96px; height: 96px; margin-bottom: 1rem; }
        h1 { margin: 0 0 .5rem; font-size: 1.6rem; }
        p { margin: 0 0 1.25rem; line-height: 1.6; color: #d1d5db; }
        button, a.btn {
            display: inline-block; background: #4f46e5; color: #fff; border: 0; border-radius: 8px;
            padding: .7rem 1.2rem; font-size: 1rem; cursor: pointer; text-decoration: none;
        }
        button:hover, a.btn:hover { background: #4338ca; }
        button:focus-visible, a.btn:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <img src="icons/icon-192.png" alt="" width="96" height="96">
        <h1>Kamu sedang offline</h1>
        <p>Halaman ini belum tersimpan di perangkat. Tugas yang pernah kamu buka tetap bisa dilihat, tapi menambah, mengubah, atau menghapus tugas butuh koneksi ke server.</p>
        <p>
            <button type="button" id="retry">Coba lagi</button>
            <a class="btn" href="index.php?page=personal">Ke halaman utama</a>
        </p>
    </main>
    <script>
        document.getElementById('retry').addEventListener('click', function () { location.reload(); });
        window.addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
